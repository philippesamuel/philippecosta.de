INHERIT: ./mkdocs.maybe-insiders.yml
site_name: Philippe Costa | Engineer | Data | Developer
site_description: Chemical Engineer (M.Sc., TU Berlin) and Developer based in Berlin. Focus on Automations with n8n.
site_url: https://philippecosta.de/
repo_name: philippesamuel/philippecosta.de
repo_url: https://github.com/philippesamuel/philippecosta.de
theme:
  name: material
  custom_dir: docs/overrides
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/lightbulb-auto
      name: Switch to light mode
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: blue grey
    accent: teal
    toggle:
      icon: material/lightbulb
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: blue grey
    accent: teal
    toggle:
      icon: material/lightbulb-outline
      name: Switch to system preference
  features:
  - content.code.annotate
  - content.code.copy
  # - content.code.select
  - content.footnote.tooltips
  - navigation.tabs
  - content.tabs.link
  - navigation.tabs.sticky
  - content.tooltips
  - navigation.footer
  - navigation.indexes
  - navigation.instant
  - navigation.instant.prefetch
  # - navigation.instant.preview
  - navigation.instant.progress
  - navigation.path
  - navigation.top
  - navigation.tracking
  - search.highlight
  - search.share
  - search.suggest
  - toc.follow

  icon:
    repo: fontawesome/brands/github-alt
  logo: img/favicon.png
  favicon: img/favicon.png
  language: en
plugins:
  # Material for MkDocs
  search:
  social:
  # Other plugins
  macros:
    include_yaml:
    - projects: data/projects.yml
    - members: data/members.yml

nav:
  - index.md
  - Projects :
    - projects.md

markdown_extensions:
  # Python Markdown
  abbr:
  admonition:
  attr_list:
  footnotes:
  md_in_html:
  tables:
  toc:
    permalink: true

  # Python Markdown Extensions
  pymdownx.betterem:
    smart_enable: all
  pymdownx.caret:
  pymdownx.details:
  pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
    options:
      custom_icons:
        - overrides/.icons
  pymdownx.highlight:
    line_spans: __span
  pymdownx.inlinehilite:
  pymdownx.keys:
  pymdownx.mark:
  pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
  pymdownx.tilde:

  # pymdownx blocks
  pymdownx.blocks.admonition:
    types:
    - note
    - attention
    - caution
    - danger
    - error
    - tip
    - hint
    - warning
  pymdownx.blocks.details:
  pymdownx.blocks.tab:
    alternate_style: True

  # Other extensions
  mdx_include:

extra:
  social:
  - icon: fontawesome/brands/github-alt
    link: https://github.com/philippesamuel
  # - icon: fontawesome/brands/twitter
    # link: https://twitter.com/tiangolo
  - icon: fontawesome/brands/linkedin
    link: https://www.linkedin.com/in/santosdacosta
  - icon: fontawesome/brands/dev
    link: https://dev.to/philippecosta
  - icon: fontawesome/brands/medium
    link: https://medium.com/@philippe.sa.costa
  - icon: fontawesome/solid/globe
    link: https://philippecosta.de
  - icon: fontawesome/solid/envelope
    link: mailto:contact@philippecosta.de

extra_css:
  - css/termynal.css
  - css/custom.css

extra_javascript:
  - js/termynal.js
  - js/custom.js

hooks:
  - scripts/mkdocs_hooks.py
